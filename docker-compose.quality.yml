services:
  postgres-quality:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dramaforge
      POSTGRES_USER: dramaforge
      POSTGRES_PASSWORD: quality-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dramaforge -d dramaforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-quality:
    build:
      context: .
      dockerfile: backend/Dockerfile.quality
    depends_on:
      postgres-quality:
        condition: service_healthy
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://dramaforge:quality-postgres-password@postgres-quality:5432/dramaforge
      SESSION_SECRET: quality-session-secret-32-characters
      BYOK_FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AGNES_ENABLED: "false"
      TEXT_LLM_ENABLED: "false"
      TEST_PG_ENABLED: "1"
      TEST_PG_HOST: postgres-quality
      TEST_PG_PORT: "5432"
      TEST_PG_USER: dramaforge
      TEST_PG_PASSWORD: quality-postgres-password
      PUBLIC_REGISTRATION_ENABLED: "true"
    volumes:
      - quality-contract:/contract

  frontend-quality:
    build:
      context: .
      dockerfile: frontend/Dockerfile.quality
    depends_on:
      backend-quality:
        condition: service_completed_successfully
    environment:
      DRAMAFORGE_OPENAPI_JSON: /contract/openapi.json
    volumes:
      - quality-contract:/contract:ro

volumes:
  quality-contract:
