server {
    listen 8080;
    server_name _;

    # Docker service IPs change whenever a container is recreated. Resolve the
    # API service at request time so this long-lived gateway does not retain a
    # stale address and return 502 after an API-only deployment.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128m;

    # Serve the precompressed `.gz` siblings produced by the Vite build
    # (vite-plugin-compression2, gzip only). The nginx-unprivileged image
    # compiles `ngx_http_gzip_static_module`; acceptance verifies this at
    # 8080 via `Content-Encoding: gzip` before claiming delivery done.
    gzip_static on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        proxy_pass $api_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the API's documentation available through the same externally
    # published gateway as the application. Without these exact locations,
    # the SPA fallback below serves index.html for API documentation paths.
    location = /openapi.json {
        proxy_pass $api_upstream/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass $api_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs/oauth2-redirect {
        proxy_pass $api_upstream/docs/oauth2-redirect;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
