services:
  migrate: &backend-build
    image: ${DRAMAFORGE_BACKEND_IMAGE:-dramaforge-backend:dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DRAMAFORGE_VERSION: ${DRAMAFORGE_VERSION:-0.1.0}
        DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:?Set the exact source commit}

  api:
    <<: *backend-build

  dispatcher:
    <<: *backend-build

  worker-default:
    <<: *backend-build

  worker-heavy:
    <<: *backend-build

  worker-director:
    <<: *backend-build

  maintenance:
    <<: *backend-build

  frontend:
    image: ${DRAMAFORGE_FRONTEND_IMAGE:-dramaforge-frontend:dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DRAMAFORGE_VERSION: ${DRAMAFORGE_VERSION:-0.1.0}
        DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:?Set the exact source commit}
