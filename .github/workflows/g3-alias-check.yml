name: Temporary Scene Animatic & Editing Validation
on:
  push:
    branches: [codex/visual-storyboard-g1-20261008]
    paths: [.github/workflows/g3-alias-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: npm ci --prefix frontend
      - name: Format changed alias files and push formatting fix
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx --no-install prettier --write \
            src/components/assets/AssetReferencePicker.tsx \
            tests/unit/AssetReferencePicker.test.tsx \
            src/features/review/ReviewWorkspace.tsx \
            src/features/scenes/SceneMediaGallery.tsx \
            src/features/editing/EditingSourcePreview.tsx \
            src/features/editing/EditingWorkspace.tsx \
            src/features/editing/editing-source-preview.css \
            tests/unit/ReviewExactTarget.test.tsx \
            tests/unit/SceneMediaGallery.test.tsx \
            tests/unit/EditingWorkspace.test.tsx \
            src/features/scenes/SceneAnimaticPreview.tsx \
            src/features/scenes/scene-animatic.css \
            tests/unit/SceneAnimaticPreview.test.tsx
          cd ..
          git add frontend/src/components/assets/AssetReferencePicker.tsx \
            frontend/tests/unit/AssetReferencePicker.test.tsx \
            frontend/src/features/review/ReviewWorkspace.tsx \
            frontend/src/features/scenes/SceneMediaGallery.tsx \
            frontend/src/features/editing/EditingSourcePreview.tsx \
            frontend/src/features/editing/EditingWorkspace.tsx \
            frontend/src/features/editing/editing-source-preview.css \
            frontend/tests/unit/ReviewExactTarget.test.tsx \
            frontend/tests/unit/SceneMediaGallery.test.tsx \
            frontend/tests/unit/EditingWorkspace.test.tsx \
            frontend/src/features/scenes/SceneAnimaticPreview.tsx \
            frontend/src/features/scenes/scene-animatic.css \
            frontend/tests/unit/SceneAnimaticPreview.test.tsx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(g3): format editable asset alias"
            git push origin HEAD:codex/visual-storyboard-g1-20261008
          fi
      - name: Python Ruff
        run: uv run --directory backend --extra dev ruff check app/api/v1/references.py app/production/workbench_execution.py tests/unit/test_asset_reference_resolution.py tests/unit/test_shot_reference_binding.py
      - name: Backend reference unit
        run: uv run --directory backend --extra dev pytest tests/unit/test_asset_reference_resolution.py tests/unit/test_shot_reference_binding.py -q
      - name: Frontend format check
        run: npm run --prefix frontend format:check
      - name: Frontend typecheck
        run: npm run --prefix frontend typecheck
      - name: Frontend lint
        run: npm run --prefix frontend lint
      - name: All frontend unit
        run: npm run --prefix frontend test -- --run --maxWorkers=1 --minWorkers=1
      - name: Frontend build
        run: npm run --prefix frontend build
      - run: cd frontend && npx --no-install playwright install --with-deps chromium
      - name: Browser regressions
        run: cd frontend && npx --no-install playwright test visual-storyboard-g1.spec.ts navigation-ia.spec.ts professional-review.spec.ts
