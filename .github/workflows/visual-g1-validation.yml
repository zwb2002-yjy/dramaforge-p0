name: Temporary G1 Frontend Validation

on:
  push:
    branches:
      - codex/visual-storyboard-g1-20261008
    paths:
      - .github/workflows/visual-g1-validation.yml

permissions:
  contents: write

jobs:
  g1-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Format scoped G1 files and commit if needed
        run: |
          set -euo pipefail
          cd frontend
          npx --no-install prettier --write \
            src/features/scenes/SceneMediaGallery.tsx \
            src/features/scenes/SceneStoryboardWall.tsx \
            src/features/scenes/scene-wall-surface.css \
            tests/unit/SceneMediaGallery.test.tsx \
            tests/unit/SceneStoryboardWall.test.tsx \
            tests/e2e/visual-storyboard-g1.spec.ts
          cd ..
          git add frontend/src/features/scenes/SceneMediaGallery.tsx \
            frontend/src/features/scenes/SceneStoryboardWall.tsx \
            frontend/src/features/scenes/scene-wall-surface.css \
            frontend/tests/unit/SceneMediaGallery.test.tsx \
            frontend/tests/unit/SceneStoryboardWall.test.tsx \
            frontend/tests/e2e/visual-storyboard-g1.spec.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(scene-wall): format G1 frontend files"
            git push origin HEAD:codex/visual-storyboard-g1-20261008
          fi
      - name: Check formatting
        run: npm run --prefix frontend format:check
      - name: Typecheck
        run: npm run --prefix frontend typecheck
      - name: Lint and UI guard
        run: npm run --prefix frontend lint
      - name: Affected unit tests
        run: npm run --prefix frontend test -- SceneMediaGallery.test.tsx SceneStoryboardWall.test.tsx --maxWorkers=1 --minWorkers=1
      - name: Production build
        run: npm run --prefix frontend build
      - name: Install Chromium for focused browser verification
        run: cd frontend && npx --no-install playwright install --with-deps chromium
      - name: Focused storyboard browser tests
        run: cd frontend && npx --no-install playwright test visual-storyboard-g1.spec.ts
