name: Temporary Storyboard and Workbench Validation
on:
  push:
    branches:
      - codex/visual-storyboard-g1-20261008
    paths:
      - .github/workflows/visual-workbench-validation.yml

permissions:
  contents: write

jobs:
  frontend-validation:
    name: frontend-g1-g2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Format only the changed feature files
        run: |
          set -euo pipefail
          cd frontend
          npx --no-install prettier --write \
            src/features/scenes/SceneWorkspace.tsx \
            src/features/shots/ShotProductionActions.tsx \
            src/features/shots/ShotDesignPanel.tsx \
            src/features/shots/shot-inspector.css \
            ../frontend/src/routes/'projects.$projectId.scenes.$sceneId.tsx' \
            tests/unit/SceneWorkspace.test.tsx \
            tests/unit/ShotProductionActionsPlan.test.tsx \
            tests/e2e/visual-storyboard-g1.spec.ts
          cd ..
          git add frontend/src/features/scenes/SceneWorkspace.tsx \
            frontend/src/features/shots/ShotProductionActions.tsx \
            frontend/src/features/shots/ShotDesignPanel.tsx \
            frontend/src/features/shots/shot-inspector.css \
            frontend/src/routes/'projects.$projectId.scenes.$sceneId.tsx' \
            frontend/tests/unit/SceneWorkspace.test.tsx \
            frontend/tests/unit/ShotProductionActionsPlan.test.tsx \
            frontend/tests/e2e/visual-storyboard-g1.spec.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(workbench): format focused G2 files"
            git push origin HEAD:codex/visual-storyboard-g1-20261008
          fi
      - name: Formatting check
        run: npm run --prefix frontend format:check
      - name: Typecheck
        run: npm run --prefix frontend typecheck
      - name: Lint and UI authority
        run: npm run --prefix frontend lint
      - name: All unit tests
        run: npm run --prefix frontend test -- --run --maxWorkers=1 --minWorkers=1
      - name: Production build
        run: npm run --prefix frontend build
      - name: Install Chromium
        run: cd frontend && npx --no-install playwright install --with-deps chromium
      - name: Browser storyboard and navigation regressions
        run: cd frontend && npx --no-install playwright test visual-storyboard-g1.spec.ts navigation-ia.spec.ts
