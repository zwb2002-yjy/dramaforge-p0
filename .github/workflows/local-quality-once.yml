name: Local quality regression (one shot)

on:
  push:
    branches:
      - agent/local-quality-fixes-20261022
    paths:
      - .github/workflows/local-quality-once.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Backend targeted regression
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/backend \
            python:3.14-slim-bookworm \
            sh -ec '
              set -eu
              apt-get update -qq
              apt-get install -qq -y --no-install-recommends git
              git config --global --add safe.directory /workspace
              pip install --no-cache-dir "uv==0.12.0"
              uv sync --locked --extra dev
              uv run --no-sync ruff check tests/unit/test_source_evidence_cli.py tests/unit/test_directory_compliance.py ../scripts/check_directory_compliance.py
              uv run --no-sync pytest -q tests/unit/test_source_evidence_cli.py tests/unit/test_directory_compliance.py
            '
      - name: Frontend format lint typecheck and related Vitest
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/frontend \
            node:24.21.0-alpine3.24 \
            sh -ec '
              set -eu
              npm ci --ignore-scripts
              npx prettier --write src/features/script/ScriptWorkspace.tsx src/features/scenes/SceneWorkspace.tsx src/features/shots/ShotContinuityCompare.tsx package.json
              npm run format:check
              npm run lint
              npm run typecheck
              npm test -- tests/unit/ScriptWorkspace.test.tsx tests/unit/SceneWorkspace.test.tsx tests/unit/SceneWorkspaceDraftRecovery.test.tsx tests/unit/ShotContinuityCompare.test.tsx tests/unit/NavigationTransitions.test.tsx tests/unit/WorkstationShell.test.tsx
            '
      - name: Remove temporary workflow and commit validated formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/local-quality-once.yml
          git add frontend/src/features/script/ScriptWorkspace.tsx frontend/src/features/scenes/SceneWorkspace.tsx frontend/src/features/shots/ShotContinuityCompare.tsx frontend/package.json
          git diff --cached --check
          git commit -m "test(dev): verify local quality and frontend regression"
          git push origin "HEAD:agent/local-quality-fixes-20261022"
