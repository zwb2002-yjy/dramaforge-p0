# One-shot lock regeneration for security remediation. This workflow removes
# itself in the generated commit; it is not part of the resulting dev branch.
name: Security dependency lock refresh (one shot)

on:
  push:
    branches:
      - agent/security-dependency-remediation-20261022
    paths:
      - .github/workflows/security-dependency-lock-once.yml

permissions:
  contents: write

jobs:
  regenerate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Re-lock targeted security upgrades on production Python
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/backend \
            python:3.14-slim-bookworm \
            sh -ec '
              set -eu
              pip install --no-cache-dir "uv==0.12.0" "pip-audit==2.10.1"
              uv lock --upgrade-package aiohttp --upgrade-package certifi --upgrade-package pillow
              uv lock --check
              uv export --locked --no-dev --no-emit-project -o /tmp/requirements-audit.txt
              pip-audit --requirement /tmp/requirements-audit.txt
              uv sync --locked --no-dev
              uv run --no-sync python -c "
from io import BytesIO
from PIL import Image, ImageOps
image = Image.new('RGB', (24, 24), (16, 48, 80))
for fmt in ('PNG', 'JPEG'):
    output = BytesIO()
    image.save(output, format=fmt)
    output.seek(0)
    decoded = ImageOps.exif_transpose(Image.open(output))
    decoded.load()
    assert decoded.size == (24, 24)
"
            '
      - name: Commit only verified dependency change, remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-dependency-lock-once.yml
          git add backend/pyproject.toml backend/uv.lock
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(security): lock patched aiohttp certifi and Pillow 13"
          git push origin "HEAD:agent/security-dependency-remediation-20261022"
