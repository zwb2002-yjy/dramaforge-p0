# One-shot lock regeneration: a successful job commits verified uv.lock and
# removes this workflow. No workflow file remains on the resulting dev branch.
name: Security dependency lock refresh (one shot)

on:
  push:
    branches:
      - agent/security-dependency-remediation-20261022
    paths:
      - .github/workflows/security-dependency-lock-once.yml

permissions:
  contents: write

jobs:
  regenerate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Re-lock targeted security upgrades on production Python
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/backend \
            python:3.14-slim-bookworm \
            sh -ec '
              set -eu
              pip install --no-cache-dir "uv==0.12.0" "pip-audit==2.10.1"
              uv lock --upgrade-package aiohttp --upgrade-package certifi --upgrade-package pillow
              uv lock --check
              uv export --locked --no-dev --no-emit-project -o /tmp/requirements-audit.txt
              pip-audit --requirement /tmp/requirements-audit.txt
              uv sync --locked --no-dev
              uv run --no-sync python -c "from io import BytesIO; from PIL import Image, ImageOps; im = Image.new(\"RGB\", (24, 24), (16, 48, 80)); png = BytesIO(); im.save(png, format=\"PNG\"); png.seek(0); assert ImageOps.exif_transpose(Image.open(png)).size == (24, 24); jpg = BytesIO(); im.save(jpg, format=\"JPEG\"); jpg.seek(0); assert Image.open(jpg).size == (24, 24)"
            '
      - name: Commit only verified dependency change, remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-dependency-lock-once.yml
          git add backend/pyproject.toml backend/uv.lock
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(security): lock patched aiohttp certifi and Pillow 13"
          git push origin "HEAD:agent/security-dependency-remediation-20261022"
