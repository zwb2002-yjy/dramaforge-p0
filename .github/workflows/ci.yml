name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce integration branch flow
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" = "main" ]; then
            case "$HEAD_REF" in
              dev|agent/hotfix-*) ;;
              *)
                echo "Stable releases must target main from dev; only agent/hotfix-* branches are allowed for urgent fixes."
                exit 1
                ;;
            esac
          fi
          if [ "$BASE_REF" = "dev" ]; then
            case "$HEAD_REF" in
              agent/*) ;;
              *)
                echo "Only short-lived agent/<task-id> branches may target dev through a pull request."
                exit 1
                ;;
            esac
          fi
      - name: Check repository policy in a container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.12-slim \
            sh -ec '
              set -eu
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git
              python scripts/check_directory_compliance.py
              python scripts/repo_guardrails.py policy --repo-root /workspace
            '

  container-gates:
    name: container-gates
    runs-on: ubuntu-latest
    env:
      QUALITY_CONTRACT_DIR: ./tmp/quality-contract
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact quality images
        run: |
          set -euo pipefail
          mkdir -p tmp/quality-contract
          docker compose -f docker-compose.quality.yml build \
            backend-quality frontend-quality
      - name: Run backend, PostgreSQL, migration and API contract gates
        run: |
          set -euo pipefail
          docker compose -f docker-compose.quality.yml up \
            --no-build --abort-on-container-exit --exit-code-from backend-quality \
            postgres-quality backend-quality
      - name: Run frontend, generated API, build and browser gates
        run: |
          set -euo pipefail
          docker compose -f docker-compose.quality.yml run --rm --no-deps frontend-quality
      - name: Run the real pinned LiteLLM integration in containers
        run: |
          set -euo pipefail
          docker compose -f docker-compose.quality.yml up \
            --no-build --abort-on-container-exit --exit-code-from litellm-integration-quality \
            litellm-quality litellm-integration-quality
      - name: Remove quality containers and volumes
        if: always()
        run: docker compose -f docker-compose.quality.yml down --volumes --remove-orphans
