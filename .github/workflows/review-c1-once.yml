name: Review corrections validation (one shot)

on:
  push:
    branches:
      - agent/review-fix-c1-20261022
    paths:
      - .github/workflows/review-c1-once.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Python 3.14 targeted code checks and regressions
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/backend \
            python:3.14-slim-bookworm \
            sh -ec '
              set -eu
              pip install --no-cache-dir "uv==0.12.0"
              uv sync --locked --extra dev
              uv run --no-sync ruff format app/production/workbench_execution.py tests/unit/test_workbench_execution.py
              uv run --no-sync ruff check app/production/workbench_execution.py tests/unit/test_workbench_execution.py
              uv run --no-sync pytest -q tests/unit/test_workbench_execution.py
            '
      - name: Node 24 targeted frontend quality checks
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/frontend \
            node:24.21.0-alpine3.24 \
            sh -ec '
              set -eu
              npm ci --ignore-scripts
              npx prettier --write src/features/shots/ShotProductionActions.tsx tests/unit/ShotProductionActionsPlan.test.tsx
              npm run format:check
              npm run lint
              npm run typecheck
              npm test -- tests/unit/ShotProductionActionsPlan.test.tsx tests/unit/ShotProductionActions.test.tsx
            '
      - name: Finalize only verified changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/review-c1-once.yml
          git add backend/app/production/workbench_execution.py backend/tests/unit/test_workbench_execution.py frontend/src/features/shots/ShotProductionActions.tsx frontend/tests/unit/ShotProductionActionsPlan.test.tsx
          git diff --cached --check
          git commit -m "test(review): format and validate duration and plan identity fixes"
          git push origin "HEAD:agent/review-fix-c1-20261022"
