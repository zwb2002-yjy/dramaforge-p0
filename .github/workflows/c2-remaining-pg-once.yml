name: C2 PostgreSQL accepted-proof regression (one-shot)

on:
  push:
    branches:
      - agent/c2-remaining-pg-proof-20261023
    paths:
      - .github/workflows/c2-remaining-pg-once.yml

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned backend test container
        run: docker compose -f docker-compose.quality.yml build backend-quality
      - name: Verify director wakeups and production idempotency in PostgreSQL
        run: |
          set -euo pipefail
          docker compose -f docker-compose.quality.yml up -d --wait postgres-quality redis-quality
          docker compose -f docker-compose.quality.yml run --rm backend-quality sh -ec '
            uv run --directory backend ruff format tests/integration/test_director_wakeup_pg.py tests/integration/test_production_application_pg.py
            uv run --directory backend ruff format --check tests/integration/test_director_wakeup_pg.py tests/integration/test_production_application_pg.py
            uv run --directory backend ruff check tests/integration/test_director_wakeup_pg.py tests/integration/test_production_application_pg.py
            uv run --directory backend pytest -q --fail-on-skip tests/integration/test_director_wakeup_pg.py tests/integration/test_production_application_pg.py
          '
      - name: Remove one-shot workflow from verified branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-remaining-pg-once.yml
          git add backend/tests/integration/test_director_wakeup_pg.py backend/tests/integration/test_production_application_pg.py
          git diff --cached --check
          git commit -m "test(c2): finish PostgreSQL proof regression and clean CI"
          git push origin "HEAD:agent/c2-remaining-pg-proof-20261023"
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.quality.yml down --volumes --remove-orphans
