services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dramaforge
      POSTGRES_PASSWORD: dramaforge
      POSTGRES_DB: dramaforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dramaforge -d dramaforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LiteLLM Proxy (fix spec §4.1/§6/§11). Official BerriAI image, pinned. The
  # Proxy is DramaForge's unified LLM scheduler: it owns Router load-balancing /
  # retry / fallback / cost / virtual keys. DramaForge talks to it over HTTP
  # (never installs the litellm SDK). LiteLLM down does NOT block DramaForge
  # startup (fix spec §13/§122) — api/workers have no hard depends_on here.
  litellm-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.96.0}
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm}@litellm-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-change-me}
      # Deployment env for the logical aliases in infra/litellm/config.yaml.
      # Empty values are valid (config loads); an alias is usable only when its
      # api_base+api_key (or mock_response) are set. Never commit real keys.
      LITELLM_SCRIPT_QUALITY_API_BASE: ${LITELLM_SCRIPT_QUALITY_API_BASE:-}
      LITELLM_SCRIPT_QUALITY_API_KEY: ${LITELLM_SCRIPT_QUALITY_API_KEY:-}
      LITELLM_SCRIPT_QUALITY_MOCK_RESPONSE: ${LITELLM_SCRIPT_QUALITY_MOCK_RESPONSE:-}
      LITELLM_SCRIPT_FAST_API_BASE: ${LITELLM_SCRIPT_FAST_API_BASE:-}
      LITELLM_SCRIPT_FAST_API_KEY: ${LITELLM_SCRIPT_FAST_API_KEY:-}
      LITELLM_SCRIPT_FAST_MOCK_RESPONSE: ${LITELLM_SCRIPT_FAST_MOCK_RESPONSE:-}
      LITELLM_LEGACY_TEXT_API_BASE: ${LITELLM_LEGACY_TEXT_API_BASE:-}
      LITELLM_LEGACY_TEXT_API_KEY: ${LITELLM_LEGACY_TEXT_API_KEY:-}
      LITELLM_LEGACY_TEXT_MOCK_RESPONSE: ${LITELLM_LEGACY_TEXT_MOCK_RESPONSE:-}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      # liveliness only — never probe /health (may hit models + cost, §12).
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: dramaforge
      SESSION_SECRET: dev-only-change-me-to-a-long-random-string
      BYOK_FERNET_KEY: ${BYOK_FERNET_KEY:-dev-only-fernet-key-replace-in-prod==}
      CORS_ORIGINS: http://localhost:5173
      AGNES_ENABLED: ${AGNES_ENABLED:-false}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://api.agnes-ai.cn/v1}
      AGNES_IMAGE_MODEL: ${AGNES_IMAGE_MODEL:-agnes-image-2.1-flash}
      AGNES_VIDEO_MODEL: ${AGNES_VIDEO_MODEL:-agnes-video-v2.0}
      REFERENCE_PUBLIC_BASE_URL: ${REFERENCE_PUBLIC_BASE_URL:-}
      REFERENCE_TOKEN_TTL_SECONDS: ${REFERENCE_TOKEN_TTL_SECONDS:-3600}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,minio,litellm,litellm-db}
      TEXT_LLM_ENABLED: ${TEXT_LLM_ENABLED:-false}
      TEXT_LLM_API_KEY: ${TEXT_LLM_API_KEY:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-deepseek-v4-flash}
      TEXT_LLM_API_STYLE: ${TEXT_LLM_API_STYLE:-anthropic}
      LITELLM_GATEWAY_URL: ${LITELLM_GATEWAY_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      TEXT_V3_ROUTER_ENABLED: ${TEXT_V3_ROUTER_ENABLED:-false}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_ENGINE: ${TTS_ENGINE:-espeak-ng}
      TTS_VOICE: ${TTS_VOICE:-zh}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: dramaforge
      SESSION_SECRET: dev-only-change-me-to-a-long-random-string
      BYOK_FERNET_KEY: ${BYOK_FERNET_KEY:-dev-only-fernet-key-replace-in-prod==}
      OUTBOX_DISPATCH_INTERVAL_SECONDS: ${OUTBOX_DISPATCH_INTERVAL_SECONDS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "app.workers.dispatcher"]

  worker-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SESSION_SECRET: dev-only-change-me-to-a-long-random-string
      BYOK_FERNET_KEY: ${BYOK_FERNET_KEY:-dev-only-fernet-key-replace-in-prod==}
      WORKER_KIND: default
      AGNES_ENABLED: ${AGNES_ENABLED:-false}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://api.agnes-ai.cn/v1}
      AGNES_IMAGE_MODEL: ${AGNES_IMAGE_MODEL:-agnes-image-2.1-flash}
      AGNES_VIDEO_MODEL: ${AGNES_VIDEO_MODEL:-agnes-video-v2.0}
      REFERENCE_PUBLIC_BASE_URL: ${REFERENCE_PUBLIC_BASE_URL:-}
      REFERENCE_TOKEN_TTL_SECONDS: ${REFERENCE_TOKEN_TTL_SECONDS:-3600}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,minio,litellm,litellm-db}
      TEXT_LLM_ENABLED: ${TEXT_LLM_ENABLED:-false}
      TEXT_LLM_API_KEY: ${TEXT_LLM_API_KEY:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-deepseek-v4-flash}
      TEXT_LLM_API_STYLE: ${TEXT_LLM_API_STYLE:-anthropic}
      LITELLM_GATEWAY_URL: ${LITELLM_GATEWAY_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      TEXT_V3_ROUTER_ENABLED: ${TEXT_V3_ROUTER_ENABLED:-false}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_ENGINE: ${TTS_ENGINE:-espeak-ng}
      TTS_VOICE: ${TTS_VOICE:-zh}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python -m app.workers.main default && arq app.workers.default.WorkerSettings",
      ]
    restart: unless-stopped

  worker-heavy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SESSION_SECRET: dev-only-change-me-to-a-long-random-string
      BYOK_FERNET_KEY: ${BYOK_FERNET_KEY:-dev-only-fernet-key-replace-in-prod==}
      WORKER_KIND: heavy
      ARQ_HEAVY_MAX_JOBS: ${ARQ_HEAVY_MAX_JOBS:-4}
      AGNES_ENABLED: ${AGNES_ENABLED:-false}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://api.agnes-ai.cn/v1}
      AGNES_IMAGE_MODEL: ${AGNES_IMAGE_MODEL:-agnes-image-2.1-flash}
      AGNES_VIDEO_MODEL: ${AGNES_VIDEO_MODEL:-agnes-video-v2.0}
      REFERENCE_PUBLIC_BASE_URL: ${REFERENCE_PUBLIC_BASE_URL:-}
      REFERENCE_TOKEN_TTL_SECONDS: ${REFERENCE_TOKEN_TTL_SECONDS:-3600}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,minio,litellm,litellm-db}
      TEXT_LLM_ENABLED: ${TEXT_LLM_ENABLED:-false}
      TEXT_LLM_API_KEY: ${TEXT_LLM_API_KEY:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-deepseek-v4-flash}
      TEXT_LLM_API_STYLE: ${TEXT_LLM_API_STYLE:-anthropic}
      LITELLM_GATEWAY_URL: ${LITELLM_GATEWAY_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      TEXT_V3_ROUTER_ENABLED: ${TEXT_V3_ROUTER_ENABLED:-false}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_ENGINE: ${TTS_ENGINE:-espeak-ng}
      TTS_VOICE: ${TTS_VOICE:-zh}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python -m app.workers.main heavy && arq app.workers.heavy.WorkerSettings",
      ]
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  litellm_db_data:
