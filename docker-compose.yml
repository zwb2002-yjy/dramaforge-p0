services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dramaforge
      POSTGRES_PASSWORD: dramaforge
      POSTGRES_DB: dramaforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dramaforge -d dramaforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: dramaforge
      SESSION_SECRET: dev-only-change-me-to-a-long-random-string
      BYOK_FERNET_KEY: dev-only-fernet-key-replace-in-prod==
      CORS_ORIGINS: http://localhost:5173
      AGNES_ENABLED: ${AGNES_ENABLED:-false}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://api.agnes-ai.cn/v1}
      AGNES_IMAGE_MODEL: ${AGNES_IMAGE_MODEL:-agnes-image-2.1-flash}
      AGNES_VIDEO_MODEL: ${AGNES_VIDEO_MODEL:-agnes-video-v2.0}
      REFERENCE_PUBLIC_BASE_URL: ${REFERENCE_PUBLIC_BASE_URL:-}
      REFERENCE_TOKEN_TTL_SECONDS: ${REFERENCE_TOKEN_TTL_SECONDS:-3600}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,minio}
      TEXT_LLM_ENABLED: ${TEXT_LLM_ENABLED:-false}
      TEXT_LLM_API_KEY: ${TEXT_LLM_API_KEY:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-deepseek-v4-flash}
      TEXT_LLM_API_STYLE: ${TEXT_LLM_API_STYLE:-anthropic}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_ENGINE: ${TTS_ENGINE:-espeak-ng}
      TTS_VOICE: ${TTS_VOICE:-zh}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: dramaforge
      SESSION_SECRET: dev-only-change-me-to-a-long-random-string
      BYOK_FERNET_KEY: dev-only-fernet-key-replace-in-prod==
      OUTBOX_DISPATCH_INTERVAL_SECONDS: ${OUTBOX_DISPATCH_INTERVAL_SECONDS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "app.workers.dispatcher"]

  worker-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SESSION_SECRET: dev-only-change-me-to-a-long-random-string
      BYOK_FERNET_KEY: dev-only-fernet-key-replace-in-prod==
      WORKER_KIND: default
      AGNES_ENABLED: ${AGNES_ENABLED:-false}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://api.agnes-ai.cn/v1}
      AGNES_IMAGE_MODEL: ${AGNES_IMAGE_MODEL:-agnes-image-2.1-flash}
      AGNES_VIDEO_MODEL: ${AGNES_VIDEO_MODEL:-agnes-video-v2.0}
      REFERENCE_PUBLIC_BASE_URL: ${REFERENCE_PUBLIC_BASE_URL:-}
      REFERENCE_TOKEN_TTL_SECONDS: ${REFERENCE_TOKEN_TTL_SECONDS:-3600}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,minio}
      TEXT_LLM_ENABLED: ${TEXT_LLM_ENABLED:-false}
      TEXT_LLM_API_KEY: ${TEXT_LLM_API_KEY:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-deepseek-v4-flash}
      TEXT_LLM_API_STYLE: ${TEXT_LLM_API_STYLE:-anthropic}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_ENGINE: ${TTS_ENGINE:-espeak-ng}
      TTS_VOICE: ${TTS_VOICE:-zh}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python -m app.workers.main default && arq app.workers.default.WorkerSettings",
      ]
    restart: unless-stopped

  worker-heavy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DRAMAFORGE_SOURCE_COMMIT: ${DRAMAFORGE_SOURCE_COMMIT:-}
      DATABASE_URL: postgresql+asyncpg://dramaforge:dramaforge@postgres:5432/dramaforge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SESSION_SECRET: dev-only-change-me-to-a-long-random-string
      BYOK_FERNET_KEY: dev-only-fernet-key-replace-in-prod==
      WORKER_KIND: heavy
      ARQ_HEAVY_MAX_JOBS: ${ARQ_HEAVY_MAX_JOBS:-4}
      AGNES_ENABLED: ${AGNES_ENABLED:-false}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://api.agnes-ai.cn/v1}
      AGNES_IMAGE_MODEL: ${AGNES_IMAGE_MODEL:-agnes-image-2.1-flash}
      AGNES_VIDEO_MODEL: ${AGNES_VIDEO_MODEL:-agnes-video-v2.0}
      REFERENCE_PUBLIC_BASE_URL: ${REFERENCE_PUBLIC_BASE_URL:-}
      REFERENCE_TOKEN_TTL_SECONDS: ${REFERENCE_TOKEN_TTL_SECONDS:-3600}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,minio}
      TEXT_LLM_ENABLED: ${TEXT_LLM_ENABLED:-false}
      TEXT_LLM_API_KEY: ${TEXT_LLM_API_KEY:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-deepseek-v4-flash}
      TEXT_LLM_API_STYLE: ${TEXT_LLM_API_STYLE:-anthropic}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_ENGINE: ${TTS_ENGINE:-espeak-ng}
      TTS_VOICE: ${TTS_VOICE:-zh}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python -m app.workers.main heavy && arq app.workers.heavy.WorkerSettings",
      ]
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
