[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dramaforge-backend"
version = "0.1.0"
description = "DramaForge P0 API and workers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0,<0.35",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "aiosqlite>=0.20.0,<0.23",
  "asyncpg>=0.30.0,<0.31",
  "alembic>=1.14.0,<2",
  "httpx>=0.28.0,<0.29",
  "cryptography>=43.0.0,<45",
  "Pillow>=11.0.0,<12",
  "numpy>=1.26.0,<2",
  "onnx>=1.16.0,<2",
  "onnxruntime>=1.19.0,<2",
  "opencv-python-headless>=4.10.0,<5",
  "scikit-image>=0.24.0,<0.27",
  "scikit-learn>=1.5.0,<2",
  "albumentations>=1.4.0,<3",
  "matplotlib>=3.9.0,<4",
  "prettytable>=3.10.0,<4",
  "easydict>=1.13,<2",
  "arq>=0.26.0,<0.27",
  "redis>=5.2.0,<6",
  "prometheus-client>=0.21.0,<0.22",
  "python-multipart>=0.0.12,<0.1",
  "itsdangerous>=2.2.0,<3",
  "email-validator>=2.2.0,<3",
  "minio>=7.2.0,<8",
  "psycopg[binary]>=3.2.0,<4",
  # The optional face-analysis runtime is installed in the release image, but
  # no pretrained weights are bundled or downloaded.  Keep every image
  # dependency in the lockfile instead of installing undeclared packages in
  # Docker.
  "insightface==0.7.3",
  "requests>=2.28.0,<3",
  "tqdm>=4.66.0,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<0.26",
  "ruff>=0.8.0,<0.10",
  "mypy>=1.13.0,<2",
  "types-redis>=4.6.0",
  "PyYAML>=6.0.0,<7",
  "types-PyYAML>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Frozen Alembic migration history: keep the SQL/revision logic untouched;
# style-only line-length is exempted so `ruff check app tests alembic` is clean.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
