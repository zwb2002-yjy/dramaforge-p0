services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  litellm:
    ports:
      - "4000:4000"

  api:
    environment:
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8000"

  frontend:
    profiles:
      - production-ui
