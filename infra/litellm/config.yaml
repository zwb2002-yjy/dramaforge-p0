# LiteLLM Proxy configuration for DramaForge (fix spec §15/§75/§89).
#
# These legacy aliases remain readable during the DB cutover. New versioned
# deployments are managed in the Proxy DB; never create a DB deployment with
# an existing YAML alias. Every executable alias must identify one deployment.
#
# Secrets use litellm's ``os.environ/<KEY>`` substitution — never write real
# keys here (fix spec §75). Empty values are valid; an alias becomes usable
# only when its api_base+api_key (or mock_response) are provided. For a local
# demo without provider keys, set ``*_MOCK_RESPONSE`` to a canned text; the
# proxy then serves that text without calling an upstream provider.

model_list:
  - model_name: script-quality
    litellm_params:
      model: os.environ/LITELLM_SCRIPT_QUALITY_MODEL
      api_base: os.environ/LITELLM_SCRIPT_QUALITY_API_BASE
      api_key: os.environ/LITELLM_SCRIPT_QUALITY_API_KEY
      thinking:
        type: disabled
      mock_response: os.environ/LITELLM_SCRIPT_QUALITY_MOCK_RESPONSE

  - model_name: script-fast
    litellm_params:
      model: os.environ/LITELLM_SCRIPT_FAST_MODEL
      api_base: os.environ/LITELLM_SCRIPT_FAST_API_BASE
      api_key: os.environ/LITELLM_SCRIPT_FAST_API_KEY
      thinking:
        type: disabled
      mock_response: os.environ/LITELLM_SCRIPT_FAST_MOCK_RESPONSE

router_settings:
  # One alias has one fixed deployment; duplicate groups are rejected by policy.
  num_retries: 0
  fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []

litellm_settings:
  callbacks: [proxy_policy.policy]
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Strict (spec §62): never silently drop unsupported params.
  drop_params: false
  # Existing historical receipt parsing remains; no billing product is added.
  disable_spend_logs: true
  database_connection_pool_limit: 10
  store_model_in_db: true
